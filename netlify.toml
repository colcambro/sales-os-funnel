[build]
  command = "npm run build"
  # `dist/client` holds the Vite client build (JS/CSS/robots.txt). We set
  # `publish` explicitly (see below for why this matters) while `functions`
  # points at our hand-written Stripe functions. The TanStack Start SSR
  # function (.netlify/v1/functions/server.mjs, written by the
  # @netlify/vite-plugin-tanstack-start plugin) is picked up automatically
  # via the .netlify/v1/ convention and serves as the catch-all for any
  # request that isn't a static file or an explicit redirect below.
  publish = "dist/client"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# This app is served at sossalesandscaling.com/sales-os/, proxied from
# the main site's own separate Netlify project (see HANDOFF.md for that
# proxy rule). Vite's `base: "/sales-os/"` (vite.config.ts) makes the
# built HTML/JS reference assets at URLs like
# /sales-os/assets/styles-XXXX.css — but Vite's outDir is NOT prefixed
# by `base`, so the files themselves physically land at dist/client/assets/*
# (no /sales-os prefix). Without `publish` set, Netlify never uploads
# dist/client as static assets at all, so every asset request — and even
# with `publish` set, every request under the /sales-os/assets/ URL
# prefix specifically — would fall through to the SSR function (which
# doesn't know those routes) and 404/503 instead of serving the file. This
# redirect bridges that URL-prefix vs. physical-path mismatch.
[[redirects]]
  from = "/sales-os/assets/*"
  to = "/assets/:splat"
  status = 200
  force = true

# Same URL-prefix vs. physical-path mismatch as the /assets/* redirect above,
# but for the testimonial headshots/logos in public/images/ (referenced as
# plain "/images/..." <img src> paths in TestimonialGrid.tsx and
# MeetFoundersSection.tsx). Vite copies public/ straight into dist/client/
# with no /sales-os prefix, so without this rule every image 404s under the
# /sales-os/ URL prefix the live site (and the proxy from the main site)
# actually uses — this was shipped without it and caught after go-live via
# broken testimonial photos (e.g. Gary / G33 Media).
[[redirects]]
  from = "/sales-os/images/*"
  to = "/images/:splat"
  status = 200
  force = true

# netlify/functions/get-checkout-session.js is a plain hand-written Netlify
# Function for Stripe (read-only session verification for the thank-you
# page), separate from and additional to the TanStack Start adapter's
# auto-generated SSR function. Checkout itself needs no function of its own
# — it links straight to Stripe's hosted Payment Links (see checkout.tsx).
#
# Netlify Functions always live at the fixed /.netlify/functions/ path
# regardless of the app's own base path — outside the /sales-os/* prefix
# the main site's proxy rule forwards — so this rewrite brings them under
# that same prefix (src/routes/checkout.tsx and thank-you.tsx call
# `${BASE_PATH}/api/...`, not /.netlify/functions/... directly), making one
# single proxy rule on the main site cover both pages and API calls.
[[redirects]]
  from = "/sales-os/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

